# Agentic RL: router-policy training (python scripts/train_rl.py -c configs/rl/reinforce.yaml)
train:
  iterations: 60
  episodes_per_update: 16
  lr: 0.003
  discount: 1.0
  value_coef: 0.5
  entropy_coef: 0.01
  hidden: 64
  seed: 0
reward:
  alpha_task_success: 1.0
  beta_citation_quality: 0.3
  gamma_evidence_quality: 0.5
  lambda_tool_cost: 0.03
  mu_step_penalty: 0.02
  nu_invalid_action: 0.1
split:
  test_fraction: 0.3
  seed: 0
out_dir: data/processed/rl
