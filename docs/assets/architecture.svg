<text x="512" y="574" fill="#57534e" font-size="11">verified, small scale · QLoRA not validated</text>
<rect x="780" y="534" width="250" height="64" rx="10" fill="#f7f6f3" stroke="#e7e5e4"/>
<text x="792" y="556" fill="#1c1917" font-size="13" font-weight="600">REINFORCE router</text>
<text x="792" y="574" fill="#57534e" font-size="11">verified, small scale · GRPO smoke only</text>
