<text x="872" y="150" fill="#1c1917" font-size="13" font-weight="600">router</text>
<text x="872" y="168" fill="#57534e" font-size="11">heuristic · LLM JSON · learned</text>
<rect x="1112" y="128" width="128" height="52" rx="10" fill="#f7f6f3" stroke="#e7e5e4"/>
<text x="1124" y="150" fill="#1c1917" font-size="13" font-weight="600">writer</text>
<text x="1124" y="168" fill="#57534e" font-size="11">answer or budget</text>
<rect x="860" y="214" width="220" height="64" rx="10" fill="#f7f6f3" stroke="#e7e5e4"/>
<text x="872" y="236" fill="#1c1917" font-size="13" font-weight="600">act</text>
<text x="872" y="254" fill="#57534e" font-size="11">one tool, then the critic</text>
<rect x="860" y="312" width="220" height="52" rx="10" fill="#f7f6f3" stroke="#e7e5e4"/>
<text x="872" y="334" fill="#1c1917" font-size="13" font-weight="600">critic</text>
<text x="872" y="352" fill="#57534e" font-size="11">loops back to the router</text>
<rect x="800" y="388" width="430" height="64" rx="10" fill="#f7f6f3" stroke="#e7e5e4"/>
<text x="812" y="410" fill="#1c1917" font-size="13" font-weight="600">Router chooses the edge</text>
<text x="812" y="428" fill="#57534e" font-size="11">tool → act · replan → planner · answer or budget → writer</text>
