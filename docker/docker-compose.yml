# Local production-like stack.
#   docker compose -f docker/docker-compose.yml up --build            # api + worker + redis + qdrant
#   docker compose -f docker/docker-compose.yml --profile gpu up      # + vLLM (requires NVIDIA GPU)
# First run: ingest inside the api container:
#   docker compose -f docker/docker-compose.yml exec api atlas ingest data/raw
x-atlas-env: &atlas-env
  ATLAS__SERVING__QUEUE_BACKEND: redis
  ATLAS__SERVING__REDIS_URL: redis://redis:6379/0
  ATLAS__CACHE__BACKEND: redis
  ATLAS__RETRIEVAL__VECTOR_STORE: qdrant
  ATLAS__RETRIEVAL__QDRANT_URL: http://qdrant:6333
  # LLM served by vLLM (gpu profile). Without a GPU, override to extractive or a hosted API.
  ATLAS__LLM__PROVIDER: ${ATLAS_LLM_PROVIDER:-openai_compatible}
  ATLAS__LLM__BASE_URL: ${ATLAS_LLM_BASE_URL:-http://vllm:8000/v1}
  ATLAS__LLM__MODEL: ${ATLAS_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
  ATLAS__VLM__PROVIDER: ${ATLAS_VLM_PROVIDER:-none}
  ATLAS__TOOLS__PYTHON_MODE: disabled
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  api:
    build: {context: .., dockerfile: docker/Dockerfile}
    image: atlas:latest
    environment: *atlas-env
    ports: ["8000:8000"]
    volumes: ["../data:/app/data", "hf-cache:/models"]
    depends_on:
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped

  worker:
    image: atlas:latest
    command: ["atlas", "worker"]
    environment: *atlas-env
    volumes: ["../data:/app/data", "hf-cache:/models"]
    depends_on:
      redis: {condition: service_healthy}
    deploy: {replicas: 2}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: ["--model", "${ATLAS_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}", "--max-model-len", "8192",
              "--gpu-memory-utilization", "0.90", "--enable-prefix-caching"]
    ports: ["8001:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes: {hf-cache: {}, redis-data: {}, qdrant-data: {}}
