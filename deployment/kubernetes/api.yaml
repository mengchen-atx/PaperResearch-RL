apiVersion: apps/v1
kind: Deployment
metadata: {name: atlas-api, namespace: atlas, labels: {app: atlas-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: atlas-api}}
  template:
    metadata: {labels: {app: atlas-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: atlas:latest
          args: ["atlas", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{configMapRef: {name: atlas-config}}, {secretRef: {name: atlas-secrets, optional: true}}]
          resources:
            requests: {cpu: "1", memory: 3Gi}      # embedder + reranker run on CPU in the API pod
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: atlas-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: atlas-api, namespace: atlas}
spec:
  selector: {app: atlas-api}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: atlas-api, namespace: atlas}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: atlas-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
