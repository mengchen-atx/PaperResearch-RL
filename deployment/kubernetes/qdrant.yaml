apiVersion: apps/v1
kind: StatefulSet
metadata: {name: qdrant, namespace: atlas}
spec:
  serviceName: qdrant
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports: [{containerPort: 6333}]
          resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "2", memory: 4Gi}}
          readinessProbe: {httpGet: {path: /readyz, port: 6333}, periodSeconds: 10}
          volumeMounts: [{name: storage, mountPath: /qdrant/storage}]
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: qdrant, namespace: atlas}
spec: {selector: {app: qdrant}, ports: [{port: 6333}]}
