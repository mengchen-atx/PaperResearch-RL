apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: atlas}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "1", memory: 1500Mi}}
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: atlas}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
