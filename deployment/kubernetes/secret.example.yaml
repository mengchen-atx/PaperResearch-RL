# Example only — never commit real values. Create with:
#   kubectl -n atlas create secret generic atlas-secrets --from-literal=ANTHROPIC_API_KEY=... --from-literal=TAVILY_API_KEY=...
apiVersion: v1
kind: Secret
metadata: {name: atlas-secrets, namespace: atlas}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<set-me>"
  TAVILY_API_KEY: "<set-me>"
