<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Research</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --accent:#2f5d8a; --ok:#2e7d4f; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --panel:#1d1d1b; --ink:#ecebe6; --muted:#9b9a93; --line:#33322e; --accent:#7fb0e0; --ok:#6cc08f; --err:#f28b82; } }
  * { box-sizing:border-box; } body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; } header span { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap:16px; padding:16px 24px; max-width:1400px; margin:auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding:12px 16px; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  textarea { width:100%; min-height:84px; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  button, select { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #answer { white-space:pre-wrap; } .cite { color:var(--accent); font-weight:600; }
  .ev { border-left:3px solid var(--line); padding:4px 10px; margin:6px 0; font-size:13px; }
  .ev.cited { border-color:var(--accent); } .muted { color:var(--muted); font-size:12px; }
  .step { font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line); overflow-wrap:anywhere; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); margin-right:6px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<header><h1>Atlas</h1><span>multimodal agentic research over your documents</span></header>
<main>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <section>
      <h2>Research question</h2>
      <textarea id="q">By how many BLEU points does Transformer (big) outperform the ConvS2S Ensemble on EN-DE?</textarea>
      <div class="row">
        <select id="policy"><option value="">default policy</option><option>heuristic</option><option>llm</option><option>learned</option></select>
        <button class="primary" id="go">Research</button>
        <span id="status" class="muted"></span>
      </div>
    </section>
    <section><h2>Report</h2><div id="plan" class="muted"></div><div id="answer" class="muted">No report yet.</div></section>
    <section><h2>Sources</h2><div id="sources" class="muted">—</div></section>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <section><h2>Agent trace</h2><div id="trace" class="muted">Tool calls and critic decisions stream here.</div></section>
    <section>
      <h2>Add a document</h2>
      <input type="file" id="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg">
      <div class="row"><button id="up">Upload &amp; re-index</button><span id="upst" class="muted"></span></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addStep(html) { if ($("trace").classList.contains("muted")) { $("trace").innerHTML = ""; $("trace").classList.remove("muted"); }
  const d = document.createElement("div"); d.className = "step"; d.innerHTML = html; $("trace").appendChild(d); }
function onEvent(ev) {
  if (ev.node === "planner") { $("plan").innerHTML = "<b>Plan:</b> " + ev.subquestions.map(esc).join(" · "); addStep('<span class="tag">planner</span>' + ev.subquestions.length + " sub-question(s)"); }
  else if (ev.node === "router") addStep('<span class="tag">router</span>&rarr; <b>' + esc(ev.action) + "</b> " + (ev.fallback ? "(fallback) " : "") + '<span class="muted">' + esc(ev.rationale) + "</span>");
  else if (ev.node === "act") (ev.tool_calls || []).forEach(t => addStep('<span class="tag">tool</span>' + esc(t.tool) + ' <span class="' + (t.ok ? "ok" : "err") + '">' + (t.ok ? "ok" : esc(t.error)) + "</span> +" + t.new_evidence + " evidence · " + Math.round(t.latency_ms) + " ms"));
  else if (ev.node === "critic") (ev.critiques || []).forEach(c => addStep('<span class="tag">critic</span>coverage ' + c.coverage + " · sufficient=" + c.sufficient));
  else if (ev.node === "error") addStep('<span class="tag">error</span><span class="err">' + esc(ev.error) + "</span>");
}
function render(result) {
  const r = result.report || {};
  $("answer").classList.remove("muted");
  $("answer").innerHTML = esc(result.answer).replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
  $("sources").classList.remove("muted");
  $("sources").innerHTML = (r.sources || []).map(s => '<div class="ev ' + (s.cited ? "cited" : "") + '"><b>[' + s.marker + "]</b> " + esc(s.label) +
    ' <span class="muted">' + esc(s.modality) + " via " + esc(s.tool) + "</span><br>" + esc(s.excerpt) + "</div>").join("") || "No sources.";
  $("status").textContent = result.status + " · " + (result.tool_history || []).length + " tool calls · " + (result.latency_ms / 1000).toFixed(1) + "s";
}
$("go").onclick = async () => {
  $("trace").innerHTML = ""; $("answer").textContent = "Researching…"; $("sources").textContent = "—"; $("plan").textContent = "";
  const body = { query: $("q").value, mode: "async" }; if ($("policy").value) body.policy = $("policy").value;
  const res = await fetch("/research", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const job = await res.json(); if (!res.ok) { $("answer").textContent = JSON.stringify(job); return; }
  $("status").textContent = "job " + job.job_id;
  const es = new EventSource(job.events_url);
  es.onmessage = (m) => onEvent(JSON.parse(m.data));
  ["planner","router","act","critic","writer","error"].forEach(n => es.addEventListener(n, (m) => onEvent(JSON.parse(m.data))));
  es.addEventListener("end", async () => { es.close(); const j = await (await fetch(job.status_url)).json();
    if (j.result) render(j.result); else $("answer").textContent = "Failed: " + (j.error || "unknown"); });
};
$("up").onclick = async () => {
  const f = $("file").files[0]; if (!f) return; const fd = new FormData(); fd.append("file", f);
  const r = await fetch("/documents", { method: "POST", body: fd }); const j = await r.json();
  $("upst").textContent = r.ok ? "saved " + j.saved + " · re-index " + j.reindex : (j.detail || "upload failed");
};
</script>
</body>
</html>
