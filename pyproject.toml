[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atlas-research"
version = "0.1.0"
description = "Hand-built hybrid RAG, a LangGraph research agent with page-level citations, a verified benchmark, LoRA SFT, a REINFORCE tool router, and FastAPI serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Meng Chen" }]
keywords = [
  "rag",
  "llm-agents",
  "langgraph",
  "reinforcement-learning",
  "retrieval-augmented-generation",
  "multimodal",
  "lora",
  "fastapi",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  # --- core / RAG ---
  "numpy>=1.26,<3",
  "pymupdf>=1.24,<2.0",   # 2.0 garbles find_tables() cell text; see tests/unit/test_pdf_tables.py
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "torch>=2.3",
  "transformers>=4.45",
  # --- agent ---
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  # --- serving / infra ---
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "qdrant-client>=1.10",
]

[project.optional-dependencies]
train = [
  "peft>=0.12",
  "trl>=0.11",
  "accelerate>=0.33",
  "datasets>=2.20",
]
# QLoRA 4-bit quantization needs CUDA; install only on Linux+NVIDIA hosts.
qlora = ["bitsandbytes>=0.43"]
vision = ["pillow>=10.0", "num2words>=0.5", "torchvision>=0.19"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "fakeredis>=2.23",
  "ruff>=0.6",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/mengchen-atx/PaperResearch-RL"
Repository = "https://github.com/mengchen-atx/PaperResearch-RL"
Documentation = "https://github.com/mengchen-atx/PaperResearch-RL/blob/main/ARCHITECTURE.md"
Changelog = "https://github.com/mengchen-atx/PaperResearch-RL/blob/main/CHANGELOG.md"
Issues = "https://github.com/mengchen-atx/PaperResearch-RL/issues"

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: requires downloading/running real ML models",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
